name: Static QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docpronto-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check i18n.js
          node --check supabase-config.js
          node --check pwa.js
          node --check sw.js
          node --check live-update.js
          node --check tests/e2e/pwa-cache.spec.js
          node --check ads.js
          node --check beta-feedback.js
      - name: Check required files
        run: |
          test -f index.html
          test -f i18n.js
          test -f theme-v2.css
          test -f README.md
          test -f FULLSTACK.md
          test -f supabase/functions/proposal-public/index.ts
          test -f supabase/functions/proposal-response/index.ts
          test -f supabase/migrations/20261006054500_public_proposal_response.sql
          test -f supabase/migrations/20261006063000_reusable_clients.sql
          test -f supabase/migrations/20261009094447_docpronto_revoke_legacy_anonymous_table_access.sql
          test -f supabase/migrations/20261006052000_proposal_status.sql
          test -f package.json
          test -f playwright.config.js
          test -f tests/e2e/critical-flow.spec.js
          test -f tests/e2e/pwa-cache.spec.js
          test -f .github/workflows/e2e.yml
          test -f manifest.webmanifest
          test -f icon.svg
          test -f sw.js
          test -f pwa.js
          test -f ads-config.js
          test -f ads.js
          test -f ADS_SETUP.md
          test -f beta-feedback.js
          test -f supabase/functions/beta-feedback/index.ts
          test -f supabase/migrations/20261006083000_beta_feedback.sql
      - name: Check SEO and backend boot
        run: |
          grep -qi '<title' index.html
          grep -qi 'meta name="viewport"' index.html
          grep -qi 'meta name="description"' index.html
          grep -qi 'data-language="pt-BR"' index.html
          grep -qi 'data-language="en"' index.html
          grep -qi 'i18n.js' index.html
          grep -qi 'rel="canonical"' index.html
          grep -qi 'property="og:locale"' index.html
          grep -qi '"@type":"WebApplication"' index.html
          grep -qi '"isAccessibleForFree":true' index.html
          grep -qi 'supabase-config.js' index.html
          grep -qi 'proposal-status-filter' index.html
          grep -qi 'value="followup"' index.html
          grep -qi 'proposalFollowUpInfo' app.js
          grep -qi 'summary-followup' app.js
          grep -qi 'followup-badge' theme-v2.css
          grep -qi 'data-status-id' app.js
          grep -qi 'share-whatsapp' app.js
          grep -qi 'create-client-link' app.js
          grep -qi 'public-proposal-view' index.html
          grep -qi 'proposal-public' app.js
          grep -qi 'proposal-response' app.js
          grep -qi 'client-suggestions' index.html
          grep -qi 'docpronto_clients' app.js
          grep -qi 'syncClientRecord' app.js
          grep -qi 'manifest.webmanifest' index.html
          grep -qi 'pwa.js' index.html
          grep -qi 'serviceWorker' pwa.js
          grep -qi 'beforeinstallprompt' pwa.js
          grep -qi 'docpronto-shell-v2' sw.js
          grep -qi 'REVOKE ALL PRIVILEGES ON TABLE public.docpronto_documents' supabase/migrations/20261009094447_docpronto_revoke_legacy_anonymous_table_access.sql
          grep -qi "url.search" sw.js
          grep -qi "registration.scope" sw.js
          grep -qi "docpronto-shell-" live-update.js
          grep -qi 'DOCPRONTO_ADS' ads-config.js
          grep -qi 'allowedPlacement' ads.js
          grep -qi 'pagead2.googlesyndication.com' ads.js
          grep -qi 'data-ad-placement="app-footer"' index.html
          grep -qi 'data-ad-placement="public-footer"' index.html
          grep -qi 'beta-feedback-open' index.html
          grep -qi 'docpronto-beta-feedback-queue-v1' beta-feedback.js
          grep -qi 'MAX_QUEUE = 20' beta-feedback.js
          grep -qi 'docpronto_beta_feedback' supabase/functions/beta-feedback/index.ts
          grep -qi 'downloadFollowUpCalendar' app.js
          grep -qi 'data-followup-calendar' app.js
          grep -qi 'local-backup-controls' index.html
          grep -qi 'exportLocalBackup' app.js
          grep -qi 'restoreLocalBackup' app.js
          grep -qi 'docpronto-backup' app.js
          grep -qi 'proposal-template' index.html
          grep -qi 'proposalTemplates' app.js
          grep -qi 'applyProposalTemplate' app.js
          grep -qi 'business-logo-input' index.html
          grep -qi 'compressBusinessLogo' app.js
          grep -qi 'businessLogo' supabase/functions/proposal-public/index.ts
          grep -qi 'statusHistory' app.js
          grep -qi 'status-history' theme-v2.css
          grep -qi 'statusHistory' supabase/functions/proposal-response/index.ts
          grep -qi 'public-acceptance-name' app.js
          grep -qi 'acceptedBy' supabase/functions/proposal-response/index.ts
          grep -qi 'acceptedBy' supabase/functions/proposal-public/index.ts
