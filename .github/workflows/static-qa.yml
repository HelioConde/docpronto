name: Static QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check supabase-config.js
      - name: Check required files
        run: |
          test -f index.html
          test -f theme-v2.css
          test -f README.md
          test -f FULLSTACK.md
          test -f supabase/migrations/20261006052000_proposal_status.sql
      - name: Check SEO and backend boot
        run: |
          grep -qi '<title' index.html
          grep -qi 'meta name="viewport"' index.html
          grep -qi 'meta name="description"' index.html
          grep -qi 'rel="canonical"' index.html
          grep -qi 'supabase-config.js' index.html
          grep -qi 'proposal-status-filter' index.html
          grep -qi 'data-status-id' app.js
          grep -qi 'share-whatsapp' app.js
