name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docpronto-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check i18n.js
          node --check proposal-core.js
          node --check supabase-config.js
          node --check pwa.js
          node --check sw.js
          node --check live-update.js
          node --check ads.js
          node --check beta-feedback.js
      - name: Run proposal and integration tests
        run: npm test
